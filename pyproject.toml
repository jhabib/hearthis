[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthis"
version = "0.1.0"
description = "Passage-level song representation for personalized music understanding"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg==0.6.0",
  "numpy==2.3.2",
  "scipy==1.16.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
fma = ["remotezip==0.12.3"]
learned-structure = ["torch>=2.1"]

[project.scripts]
hearthis = "hearthis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
